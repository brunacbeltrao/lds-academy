<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ebece0" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · LDS Academy</title>
    <style>
      :root {
        --vinho: #a7002e;
        --vinho-escuro: #8a0026;
        --tinta: #231c1e;
        --grafite: #635a5c;
        --fundo: #ebece0;
        --superficie: #ffffff;
        --linha: #d9d9cb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--fundo);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 16px;
        color: var(--tinta);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 32px 24px;
        border: 1px solid var(--linha);
        border-radius: 16px;
        background: var(--superficie);
        text-align: center;
      }
      img {
        height: 40px;
        width: auto;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 1.375rem;
        line-height: 1.25;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        color: var(--grafite);
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--vinho);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--vinho-escuro);
      }
      button:focus-visible {
        outline: 2px solid var(--vinho);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/marca/lockup-vinho.png" alt="LDS·FDR" width="119" height="44" />
      <h1>Sem conexão</h1>
      <p>A LDS Academy precisa de internet para mostrar as aulas e os avisos. Confira a conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
